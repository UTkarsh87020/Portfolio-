<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9e00"/>
      <stop offset="100%" stop-color="#ff5400"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff9e00" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Subtle corner tech dots -->
  <circle cx="22" cy="22" r="2" fill="#00f5d4" opacity="0.4"/>
  <circle cx="106" cy="22" r="2" fill="#ff9e00" opacity="0.4"/>
  <circle cx="22" cy="106" r="2" fill="#00f5d4" opacity="0.3"/>
  <circle cx="106" cy="106" r="2" fill="#ff9e00" opacity="0.3"/>

  <!-- Monogram UR -->
  <g filter="url(#glow)">
    <!-- Letter U -->
    <path d="M 28 38 L 28 68 C 28 82, 38 90, 52 90 C 64 90, 72 82, 72 70 L 72 38" 
          fill="none" stroke="url(#neonCyan)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Letter R -->
    <path d="M 64 38 L 64 90 M 64 40 L 86 40 C 96 40, 102 47, 102 56 C 102 65, 95 71, 84 71 L 64 71 M 81 71 L 99 90" 
          fill="none" stroke="#ffffff" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Tech Accent Dot -->
    <circle cx="102" cy="38" r="4.5" fill="url(#accentOrange)"/>
  </g>
</svg>
